{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <div class="auth-symbol"><i class="bi bi-person-plus"></i></div>
  <h1 class="h3">Create your citizen account</h1>
  <p class="text-secondary">Report issues and track their progress.</p>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" name="name" required minlength="2" maxlength="100" autocomplete="name" value="{{ request.POST.name }}"></div>
    <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" name="email" required autocomplete="email" value="{{ request.POST.email }}"></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" name="password" required minlength="8" autocomplete="new-password"><div class="form-text">Use at least 8 characters.</div></div>
    <button class="btn btn-teal w-100 btn-lg">Create account</button>
  </form>
  <p class="mt-3 mb-0 small text-center">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div></div>
{% endblock %}
